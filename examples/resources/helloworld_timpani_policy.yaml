apiVersion: v1
kind: Scenario
metadata:
  name: helloworld
spec:
  condition: null
  action: launch
  target: helloworld
---
apiVersion: v1
kind: Package
metadata:
  label: null
  name: helloworld
spec:
  schedule: schedule_helloworld
  pattern:
    - type: plain
  policy: policy_helloworld
  models:
    - name: helloworld
      node: HPC
      resources:
        volume:
        network:
---
apiVersion: v1
kind: Schedule
metadata:
  name: schedule_helloworld
spec:
  - name: basic_task
    priority: 50
    policy: FIFO
    cpu_affinity: 0
    period: 200000
    release_time: 0
    runtime: 50000
    deadline: 250000
    node_id: HPC
    max_dmiss: 5
---
apiVersion: v1
kind: Policy
metadata:
  name: policy_helloworld
spec:
  placement:
    availableNodes:
      - HPC
  procedure:
    type: realtime
    strategy: stop
    trigger:
      deadlineMissThreshold:
        count: 5
---
apiVersion: v1
kind: Model
metadata:
  name: helloworld
  annotations:
    io.pullpiri.annotations.package-type: helloworld
    io.pullpiri.annotations.package-name: helloworld
    io.pullpiri.annotations.package-network: default
  labels:
    app: helloworld
spec:
  hostNetwork: true
  containers:
    - name: world
      image: ghcr.io/mco-piccolo/timpani_test:v4
      command: ["./sample_apps"]
      args: ["basic_task"]
      securityContext:
        privileged: true
        capabilities:
          add: ["SYS_NICE"]
  terminationGracePeriodSeconds: 0
