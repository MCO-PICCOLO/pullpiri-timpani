name: Dev Release (Fast Artifacts)

on:
  push:
    tags:
      - dev*

concurrency:
  group: "dev-release-${{ github.ref }}"
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

env:
  CONTAINER_REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-nodeagent:
    name: Build nodeagent (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            rust_target: x86_64-unknown-linux-musl
            apt_packages: musl-tools
            output_name: nodeagent-linux-amd64
            output_path: src/agent/nodeagent/target/x86_64-unknown-linux-musl/release/nodeagent
            asset_name: nodeagent-linux-amd64
          - arch: arm64
            rust_target: aarch64-unknown-linux-gnu
            apt_packages: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
            output_name: nodeagent-linux-arm64
            output_path: src/agent/nodeagent/target/aarch64-unknown-linux-gnu/release/nodeagent
            asset_name: nodeagent-linux-arm64
            linker: aarch64-linux-gnu-gcc

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install build dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            protobuf-compiler \
            libdbus-1-dev \
            pkg-config \
            build-essential \
            ${{ matrix.apt_packages }}

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Build nodeagent binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: ${{ matrix.linker }}
        run: |
          cd src/agent/nodeagent
          cargo build --release --target "${{ matrix.rust_target }}"

      - name: Stage binary artifact
        run: |
          mkdir -p dist/binaries
          cp "${{ matrix.output_path }}" "dist/binaries/${{ matrix.output_name }}"
          chmod +x "dist/binaries/${{ matrix.output_name }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v6
        with:
          name: nodeagent-binary-${{ matrix.arch }}
          path: dist/binaries/${{ matrix.output_name }}

      - name: Upload binary to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: dist/binaries/${{ matrix.output_name }}
          fail_on_unmatched_files: true

  build-and-push-container:
    name: Build and push container image (amd64/arm64)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.CONTAINER_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: containers/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            TARGETARCH
          tags: |
            ${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ${{ env.CONTAINER_REGISTRY }}/${{ env.IMAGE_NAME }}:dev-latest
